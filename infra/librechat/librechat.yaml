# InsightIQ custom endpoint + ClickHouse MCP for LibreChat
version: 1.2.1
cache: true

interface:
  customWelcome: "Welcome to InsightIQ — ask why a metric moved, or query ClickHouse via MCP."
  privacyPolicy:
    externalUrl: "https://www.inmobi.com"
    openNewTab: true
  termsOfService:
    externalUrl: "https://www.inmobi.com"
    openNewTab: true
  mcpServers:
    use: true
    share: false
    create: false
    public: false
  # Keep the UI focused on InsightIQ RCA + MCP
  modelSelect: true
  parameters: false
  sidePanel: true
  prompts: true
  bookmarks: false
  multiConvo: false

endpoints:
  custom:
    - name: "InsightIQ"
      apiKey: "insightiq-local"
      baseURL: "http://host.docker.internal:4000/v1/"
      models:
        default:
          - "insightiq-rca"
        fetch: false
      titleConvo: true
      titleModel: "insightiq-rca"
      modelDisplayLabel: "InsightIQ RCA"
      iconURL: "assets/logo.svg"
      dropParams:
        - "stop"
        - "user"
        - "frequency_penalty"
        - "presence_penalty"

mcpSettings:
  allowedAddresses:
    - "mcp-clickhouse:8000"
    - "host.docker.internal:8001"

mcpServers:
  clickhouse-insightiq:
    type: sse
    url: http://mcp-clickhouse:8000/sse
    headers:
      Authorization: "Bearer ${CLICKHOUSE_MCP_AUTH_TOKEN}"
    timeout: 60000
    serverInstructions: >
      You are connected to the InsightIQ ClickHouse analytics control plane.
      Prefer database insightiq. Never scan ad_events_raw for dashboards or chat —
      use the pre-computed view layer only.

      Core tables:
      - alerts_live (alert_id, advertiser_id, metric, bucket, actual, expected, zscore)
      - alert_dimension_contributors (alert_id, dimension, dimension_value, delta, contribution)
      - alert_observations (alert_id, title, detail, impact, observation_order)
      - metric_hourly_snapshot / agg_hourly (hourly rollups with joined dims)
      - baseline_hourly (4-week same hour-of-week seasonality)

      When asked why something changed, read alert_observations and
      alert_dimension_contributors for that alert_id. Narrate deterministic numbers only.
      Use read-only SQL. Compute ratios as sum/sum (never avg of ratios).
      Revenue identity: Requests × Fill rate × Render rate × eCPM / 1000.
      Do not invent numbers — only cite query results.
